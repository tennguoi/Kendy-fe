version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kendy_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kendy_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./be
    container_name: kendy_backend
    restart: always
    env_file:
      - ../.env
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    volumes:
      # Mount the .vscode config directory so the auto-resolver can read launch.json
      - ./be/.vscode:/app/.vscode
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}?preferQueryMode=simple
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - APP_REDIS_ENABLED=${APP_REDIS_ENABLED}

  frontend:
    build: ./fe
    container_name: kendy_frontend
    restart: always
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}

volumes:
  postgres_data:
